[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relaxation-converge"
version = "0.0.0"
description = "Parse VASP relaxation output and plot energy and force convergence."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]
keywords = ["vasp", "dft", "relaxation", "convergence", "materials"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.5.3",
  "matplotlib>=3.10",
  "plotext>=5.3,<6",
]

[project.scripts]
relaxation-converge = "relaxation_converge.__main__:main"

[project.urls]
Homepage = "https://github.com/LouieSlocombe/relaxation_converge"
Issues = "https://github.com/LouieSlocombe/relaxation_converge/issues"
Repository = "https://github.com/LouieSlocombe/relaxation_converge"

[dependency-groups]
dev = [
  "build>=1.6.1",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.8",
  "twine>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["relaxation_converge", "relaxation_converge.*"]

[tool.setuptools.package-data]
relaxation_converge = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=relaxation_converge --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["relaxation_converge"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
src = ["."]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["relaxation_converge", "tests"]
python_version = "3.14"
pretty = true
show_error_codes = true
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotext"]
ignore_missing_imports = true
